[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "quaecer-qualifier"
version = "1.0.0.dev0"
description = "Assess evidence for a declared use."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mariia Steeghs-Turchina" }]
dependencies = ["jsonschema>=4.26,<5", "rfc8785>=0.1.4,<0.2", "quaecer-spec-qualification>=1.0,<2"]

[project.scripts]
qualifier = "quaecer.qualifier.cli:main"

[project.urls]
Source = "https://github.com/quaecer/qualifier"

[tool.hatch.build.targets.wheel]
packages = ["src/quaecer"]

[dependency-groups]
dev = ["mypy>=1.15,<2", "pre-commit>=4,<5", "pytest>=8,<10", "ruff==0.17.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["jsonschema", "referencing"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.uv.sources]
quaecer-spec-qualification = { git = "https://github.com/quaecer/specs.git", rev = "4a088bb04632d1266144c985f6db339defe8c3a3", subdirectory = "qualification" }
